{{- $src := .Destination -}}
{{- $isPostImg := or (hasPrefix $src "https://i.postimg.cc/") (hasPrefix $src "http://i.postimg.cc/") -}}
{{- $loading := "lazy" -}}
{{- $fetchPriority := "low" -}}
{{- $altText := .PlainText | default "" -}}
<img
  src="{{ $src | safeURL }}"
  alt="{{ $altText }}"
  {{- with .Title }} title="{{ . }}"{{- end }}
  decoding="async"
  loading="{{ $loading }}"
  fetchpriority="{{ $fetchPriority }}"
  {{- if $isPostImg }} referrerpolicy="no-referrer"{{- end }}
/>
