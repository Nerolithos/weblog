{{- $src := .Destination -}}
{{- $loading := "lazy" -}}
{{- $fetchPriority := "low" -}}
{{- $altText := .PlainText | default (printf "%s 相关图片" .Page.Title) -}}
<img
  src="{{ $src | safeURL }}"
  alt="{{ $altText }}"
  {{- with .Title }} title="{{ . }}"{{- end }}
  decoding="async"
  loading="{{ $loading }}"
  fetchpriority="{{ $fetchPriority }}"
/>
