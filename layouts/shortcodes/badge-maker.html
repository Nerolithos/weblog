{{/*
Usage:

{{< badge-maker >}}

说明：
- Built-in Logo: 使用 Shields / Simple Icons slug
- Custom Logo: 上传图片，自动压缩并硬编码为 Base64
*/}}

<div class="badge-maker">

  <div class="bm-grid">

    <div class="bm-field">
      <label>左侧文字</label>
      <input
        class="bm-label"
        type="text"
        value="Hackathon"
      >
    </div>

    <div class="bm-field">
      <label>右侧文字</label>
      <input
        class="bm-message"
        type="text"
        value="AdventureX 2026"
      >
    </div>

    <div class="bm-field">
      <label>左侧颜色</label>

      <div class="bm-color-row">
        <input
          class="bm-label-color-picker"
          type="color"
          value="#555555"
        >

        <input
          class="bm-label-color"
          type="text"
          value="555555"
        >
      </div>
    </div>

    <div class="bm-field">
      <label>右侧颜色</label>

      <div class="bm-color-row">
        <input
          class="bm-message-color-picker"
          type="color"
          value="#ff8400"
        >

        <input
          class="bm-message-color"
          type="text"
          value="ff8400"
        >
      </div>
    </div>

    <div class="bm-field">
      <label>Badge Style</label>

      <select class="bm-style">
        <option value="flat">flat</option>
        <option value="flat-square" selected>flat-square</option>
        <option value="plastic">plastic</option>
        <option value="for-the-badge">for-the-badge</option>
        <option value="social">social</option>
      </select>
    </div>

    <div class="bm-field">
      <label>点击链接（可选）</label>

      <input
        class="bm-link"
        type="text"
        placeholder="https://example.com"
      >
    </div>

  </div>


  <!-- Logo Mode -->

  <div class="bm-section">

    <div class="bm-section-title">
      Logo 来源
    </div>

    <div class="bm-logo-mode">

      <label>
        <input
          type="radio"
          name="bm-logo-mode"
          value="builtin"
          checked
        >
        Shields 内置 Logo
      </label>

      <label>
        <input
          type="radio"
          name="bm-logo-mode"
          value="custom"
        >
        自定义图片
      </label>

      <label>
        <input
          type="radio"
          name="bm-logo-mode"
          value="none"
        >
        不使用 Logo
      </label>

    </div>

  </div>


  <!-- Built-in -->

  <div class="bm-builtin-panel">

    <div class="bm-field">
      <label>
        Logo 名称 / Simple Icons slug
      </label>

      <div class="bm-inline-row">
        <input
          class="bm-logo-slug"
          type="text"
          value="github"
          placeholder="github / python / apple / react"
        >

        <button
          type="button"
          class="bm-check-logo"
        >
          检查
        </button>
      </div>

      <div class="bm-logo-status"></div>
    </div>


    <div class="bm-field">
      <label>Logo 颜色</label>

      <div class="bm-color-row">
        <input
          class="bm-logo-color-picker"
          type="color"
          value="#ffffff"
        >

        <input
          class="bm-logo-color"
          type="text"
          value="ffffff"
        >
      </div>
    </div>

  </div>


  <!-- Custom -->

  <div
    class="bm-custom-panel"
    hidden
  >

    <label class="bm-drop-zone">

      <strong>
        点击或拖入自定义 Logo
      </strong>

      <span>
        支持 SVG / PNG / JPG / WEBP
      </span>

      <input
        class="bm-file-input"
        type="file"
        accept="image/svg+xml,image/png,image/jpeg,image/webp"
      >

      <img
        class="bm-logo-preview"
        alt="Logo Preview"
      >

    </label>


    <div class="bm-compress-info">
      位图过大时会自动压缩；默认最长边 64 px，目标大小约 8 KB。
    </div>


    <div class="bm-compression-options">

      <div class="bm-field">
        <label>目标大小</label>

        <select class="bm-target-size">
          <option value="4">4 KB</option>
          <option value="8" selected>8 KB</option>
          <option value="16">16 KB</option>
          <option value="32">32 KB</option>
        </select>
      </div>


      <div class="bm-field">
        <label>最长边</label>

        <select class="bm-max-dimension">
          <option value="48">48 px</option>
          <option value="64" selected>64 px</option>
          <option value="96">96 px</option>
          <option value="128">128 px</option>
        </select>
      </div>

    </div>


    <div class="bm-compression-result"></div>

  </div>


  <!-- Preview -->

  <div class="bm-preview-area">

    <div class="bm-preview-label">
      Preview
    </div>

    <img
      class="bm-badge-preview"
      alt="Badge Preview"
    >

    <div
      class="bm-preview-error"
      hidden
    ></div>

  </div>


  <!-- Outputs -->

  <div class="bm-output">
    <label>Markdown</label>

    <div class="bm-output-row">
      <textarea
        class="bm-markdown"
        readonly
      ></textarea>

      <button
        type="button"
        data-copy="markdown"
      >
        复制
      </button>
    </div>
  </div>


  <div class="bm-output">
    <label>HTML</label>

    <div class="bm-output-row">
      <textarea
        class="bm-html"
        readonly
      ></textarea>

      <button
        type="button"
        data-copy="html"
      >
        复制
      </button>
    </div>
  </div>


  <div class="bm-output">
    <label>Shields.io URL</label>

    <div class="bm-output-row">
      <textarea
        class="bm-url"
        readonly
      ></textarea>

      <button
        type="button"
        data-copy="url"
      >
        复制
      </button>
    </div>
  </div>


  <div
    class="bm-output bm-base64-box"
    hidden
  >
    <label>Custom Logo Base64</label>

    <div class="bm-output-row">
      <textarea
        class="bm-base64"
        readonly
      ></textarea>

      <button
        type="button"
        data-copy="base64"
      >
        复制
      </button>
    </div>
  </div>

</div>


<style>

<script>
(() => {

  /*
   * Locate current shortcode
   */

  const script =
    document.currentScript;

  let app =
    script.previousElementSibling;

  while (
    app &&
    !app.classList.contains("badge-maker")
  ) {
    app =
      app.previousElementSibling;
  }

  if (!app) {
    return;
  }


  const $ =
    selector =>
      app.querySelector(selector);

  const $$ =
    selector =>
      app.querySelectorAll(selector);


  /*
   * Inputs
   */

  const label =
    $(".bm-label");

  const message =
    $(".bm-message");

  const labelColor =
    $(".bm-label-color");

  const labelColorPicker =
    $(".bm-label-color-picker");

  const messageColor =
    $(".bm-message-color");

  const messageColorPicker =
    $(".bm-message-color-picker");

  const style =
    $(".bm-style");

  const link =
    $(".bm-link");


  /*
   * Built-in Logo
   */

  const logoSlug =
    $(".bm-logo-slug");

  const logoColor =
    $(".bm-logo-color");

  const logoColorPicker =
    $(".bm-logo-color-picker");

  const logoStatus =
    $(".bm-logo-status");

  const checkLogoButton =
    $(".bm-check-logo");

  const builtinPanel =
    $(".bm-builtin-panel");


  /*
   * Custom
   */

  const customPanel =
    $(".bm-custom-panel");

  const fileInput =
    $(".bm-file-input");

  const dropZone =
    $(".bm-drop-zone");

  const logoPreview =
    $(".bm-logo-preview");

  const targetSize =
    $(".bm-target-size");

  const maxDimension =
    $(".bm-max-dimension");

  const compressionResult =
    $(".bm-compression-result");

  const base64Box =
    $(".bm-base64-box");


  /*
   * Outputs
   */

  const badgePreview =
    $(".bm-badge-preview");

  const previewError =
    $(".bm-preview-error");

  const markdownOutput =
    $(".bm-markdown");

  const htmlOutput =
    $(".bm-html");

  const urlOutput =
    $(".bm-url");

  const base64Output =
    $(".bm-base64");


  /*
   * State
   */

  let customLogoData =
    "";

  let currentCustomFile =
    null;

  let logoIsValid =
    true;

  let logoCheckTimer =
    null;


  /*
   * Helpers
   */

  function currentLogoMode() {

    return $(
      'input[name="bm-logo-mode"]:checked'
    ).value;

  }


  function normalizeColor(value) {

    return String(value)
      .trim()
      .replace(/^#/, "");

  }


  function shieldsText(value) {

    return encodeURIComponent(value)
      .replaceAll("-", "--")
      .replaceAll("_", "__");

  }


  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll('"', "&quot;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");

  }


  function formatBytes(bytes) {

    if (bytes < 1024) {
      return `${bytes} B`;
    }

    return `${(bytes / 1024).toFixed(1)} KB`;

  }


  function estimateDataURLBytes(dataURL) {

    const comma =
      dataURL.indexOf(",");

    if (comma === -1) {
      return 0;
    }

    const base64 =
      dataURL.slice(comma + 1);

    return Math.round(
      base64.length * 0.75
    );

  }


  /*
   * File → Data URL
   */

  function fileToDataURL(file) {

    return new Promise(
      (
        resolve,
        reject
      ) => {

        const reader =
          new FileReader();

        reader.onload =
          () =>
            resolve(
              reader.result
            );

        reader.onerror =
          reject;

        reader.readAsDataURL(
          file
        );

      }
    );

  }


  /*
   * Blob → Data URL
   */

  function blobToDataURL(blob) {

    return new Promise(
      (
        resolve,
        reject
      ) => {

        const reader =
          new FileReader();

        reader.onload =
          () =>
            resolve(
              reader.result
            );

        reader.onerror =
          reject;

        reader.readAsDataURL(
          blob
        );

      }
    );

  }


  /*
   * File → Image
   */

  function fileToImage(file) {

    return new Promise(
      (
        resolve,
        reject
      ) => {

        const image =
          new Image();

        const objectURL =
          URL.createObjectURL(
            file
          );

        image.onload =
          () => {

            URL.revokeObjectURL(
              objectURL
            );

            resolve(image);

          };

        image.onerror =
          () => {

            URL.revokeObjectURL(
              objectURL
            );

            reject(
              new Error(
                "无法读取图片"
              )
            );

          };

        image.src =
          objectURL;

      }
    );

  }


  /*
   * Canvas → Blob
   */

  function canvasToBlob(
    canvas,
    type,
    quality
  ) {

    return new Promise(
      resolve => {

        canvas.toBlob(
          resolve,
          type,
          quality
        );

      }
    );

  }


  /*
   * 自动压缩
   */

  async function compressImageFile(
    file,
    targetBytes,
    dimension
  ) {

    /*
     * SVG 保持原样
     */

    if (
      file.type ===
      "image/svg+xml"
    ) {

      return {
        dataURL:
          await fileToDataURL(file),

        originalBytes:
          file.size,

        finalBytes:
          file.size,

        resized:
          false,

        format:
          "SVG"
      };

    }


    /*
     * 图片本身已经非常小
     */

    if (
      file.size <=
      targetBytes
    ) {

      const dataURL =
        await fileToDataURL(file);

      return {

        dataURL,

        originalBytes:
          file.size,

        finalBytes:
          estimateDataURLBytes(
            dataURL
          ),

        resized:
          false,

        format:
          file.type ||
          "image"

      };

    }


    const image =
      await fileToImage(file);


    let width =
      image.naturalWidth;

    let height =
      image.naturalHeight;


    /*
     * 初始缩放到最大 dimension
     */

    if (
      width > dimension ||
      height > dimension
    ) {

      const scale =
        Math.min(
          dimension / width,
          dimension / height
        );

      width =
        Math.max(
          1,
          Math.round(
            width * scale
          )
        );

      height =
        Math.max(
          1,
          Math.round(
            height * scale
          )
        );

    }


    const canvas =
      document.createElement(
        "canvas"
      );


    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha: true
        }
      );


    /*
     * Render helper
     */

    function draw(
      newWidth,
      newHeight
    ) {

      canvas.width =
        newWidth;

      canvas.height =
        newHeight;

      ctx.clearRect(
        0,
        0,
        newWidth,
        newHeight
      );

      ctx.imageSmoothingEnabled =
        true;

      ctx.imageSmoothingQuality =
        "high";

      ctx.drawImage(
        image,
        0,
        0,
        newWidth,
        newHeight
      );

    }


    draw(
      width,
      height
    );


    /*
     * 优先 WebP
     */

    let quality =
      0.92;

    let blob =
      await canvasToBlob(
        canvas,
        "image/webp",
        quality
      );


    /*
     * 某些浏览器 WebP 失败
     */

    if (!blob) {

      blob =
        await canvasToBlob(
          canvas,
          "image/png"
        );

    }


    /*
     * 先降质量
     */

    while (
      blob &&
      blob.size >
        targetBytes &&
      quality >
        0.35
    ) {

      quality -=
        0.08;

      blob =
        await canvasToBlob(
          canvas,
          "image/webp",
          quality
        );

    }


    /*
     * 再逐步缩尺寸
     */

    let currentWidth =
      width;

    let currentHeight =
      height;


    while (
      blob &&
      blob.size >
        targetBytes &&
      currentWidth >
        24 &&
      currentHeight >
        24
    ) {

      currentWidth =
        Math.max(
          24,
          Math.round(
            currentWidth *
            0.82
          )
        );

      currentHeight =
        Math.max(
          24,
          Math.round(
            currentHeight *
            0.82
          )
        );


      draw(
        currentWidth,
        currentHeight
      );


      blob =
        await canvasToBlob(
          canvas,
          "image/webp",
          0.70
        );

    }


    if (!blob) {

      throw new Error(
        "图片压缩失败"
      );

    }


    const dataURL =
      await blobToDataURL(
        blob
      );


    return {

      dataURL,

      originalBytes:
        file.size,

      finalBytes:
        blob.size,

      resized:
        (
          currentWidth !==
            image.naturalWidth ||
          currentHeight !==
            image.naturalHeight
        ),

      width:
        currentWidth,

      height:
        currentHeight,

      format:
        blob.type ||
        "image/webp"

    };

  }


  /*
   * Build Shields URL
   */

  function buildURL() {

    const badgeLabel =
      shieldsText(
        label.value || ""
      );

    const badgeMessage =
      shieldsText(
        message.value || ""
      );

    const badgeColor =
      encodeURIComponent(
        normalizeColor(
          messageColor.value
        ) ||
        "blue"
      );


    let url =
      `https://img.shields.io/badge/${badgeLabel}-${badgeMessage}-${badgeColor}`;


    const params =
      new URLSearchParams();


    params.set(
      "style",
      style.value
    );


    params.set(
      "labelColor",
      normalizeColor(
        labelColor.value
      ) ||
      "555555"
    );


    const mode =
      currentLogoMode();


    /*
     * Built-in
     */

    if (
      mode ===
      "builtin"
    ) {

      const slug =
        logoSlug.value.trim();

      if (slug) {

        params.set(
          "logo",
          slug
        );


        const lc =
          normalizeColor(
            logoColor.value
          );

        if (lc) {

          params.set(
            "logoColor",
            lc
          );

        }

      }

    }


    /*
     * Custom
     */

    if (
      mode ===
      "custom" &&
      customLogoData
    ) {

      params.set(
        "logo",
        customLogoData
      );

    }


    return (
      url +
      "?" +
      params.toString()
    );

  }


  /*
   * Output
   */

  function updateOutputs() {

    const badgeURL =
      buildURL();


    urlOutput.value =
      badgeURL;


    const alt =
      (
        label.value +
        " " +
        message.value
      ).trim() ||
      "badge";


    const target =
      link.value.trim();


    if (target) {

      markdownOutput.value =
        `[![${alt}](${badgeURL})](${target})`;


      htmlOutput.value =
        `<a href="${escapeHTML(target)}">` +
        `<img src="${escapeHTML(badgeURL)}" alt="${escapeHTML(alt)}">` +
        `</a>`;

    }

    else {

      markdownOutput.value =
        `![${alt}](${badgeURL})`;


      htmlOutput.value =
        `<img src="${escapeHTML(badgeURL)}" alt="${escapeHTML(alt)}">`;

    }


    if (
      currentLogoMode() ===
        "builtin" &&
      !logoIsValid
    ) {

      badgePreview.hidden =
        true;

      previewError.hidden =
        false;

      previewError.textContent =
        "当前 Logo 名称无法确认，请检查 Simple Icons slug。";

      return;

    }


    previewError.hidden =
      true;

    badgePreview.hidden =
      false;

    badgePreview.src =
      badgeURL;

  }


  /*
   * Built-in Logo Check
   */

  function checkBuiltinLogo() {

    const slug =
      logoSlug.value
        .trim()
        .toLowerCase();


    if (!slug) {

      logoIsValid =
        false;

      logoStatus.textContent =
        "请输入 Logo 名称。";

      logoStatus.className =
        "bm-logo-status error";

      updateOutputs();

      return;

    }


    logoStatus.textContent =
      "正在检查…";

    logoStatus.className =
      "bm-logo-status";


    const image =
      new Image();


    const testURL =
      "https://img.shields.io/badge/test-test-555" +
      "?logo=" +
      encodeURIComponent(slug) +
      "&logoColor=white";


    image.onload =
      () => {

        logoIsValid =
          true;

        logoStatus.textContent =
          "✓ Shields 已接受该 Logo slug";

        logoStatus.className =
          "bm-logo-status ok";

        updateOutputs();

      };


    image.onerror =
      () => {

        logoIsValid =
          false;

        logoStatus.textContent =
          "✗ 无法加载该 Logo，请检查名称";

        logoStatus.className =
          "bm-logo-status error";

        updateOutputs();

      };


    image.src =
      testURL;

  }


  /*
   * Custom File
   */

  async function loadCustomLogo(
    file
  ) {

    if (!file) {
      return;
    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      alert(
        "请选择 SVG、PNG、JPG 或 WEBP 图片。"
      );

      return;

    }


    currentCustomFile =
      file;


    compressionResult.textContent =
      "正在处理图片…";


    logoPreview.style.display =
      "none";


    try {

      const targetBytes =
        Number(
          targetSize.value
        ) *
        1024;


      const dimension =
        Number(
          maxDimension.value
        );


      const result =
        await compressImageFile(
          file,
          targetBytes,
          dimension
        );


      customLogoData =
        result.dataURL;


      base64Output.value =
        customLogoData;


      logoPreview.src =
        customLogoData;


      logoPreview.style.display =
        "block";


      const ratio =
        result.originalBytes > 0
          ?
          (
            (
              1 -
              result.finalBytes /
              result.originalBytes
            ) *
            100
          ).toFixed(0)
          :
          0;


      if (
        file.type ===
        "image/svg+xml"
      ) {

        compressionResult.textContent =
          `SVG 保持原格式，大小 ${formatBytes(result.finalBytes)}。`;

      }

      else {

        compressionResult.textContent =
          `原始 ${formatBytes(result.originalBytes)} → ` +
          `${formatBytes(result.finalBytes)}` +
          (
            result.width &&
            result.height
              ?
              `，${result.width}×${result.height}px`
              :
              ""
          ) +
          (
            Number(ratio) > 0
              ?
              `，减少约 ${ratio}%`
              :
              ""
          ) +
          `。`;

      }


      updateOutputs();

    }

    catch (error) {

      console.error(error);

      customLogoData =
        "";

      base64Output.value =
        "";

      compressionResult.textContent =
        "图片处理失败。";

      alert(
        "图片压缩失败，请尝试另一张图片或使用 SVG。"
      );

    }

  }


  /*
   * Mode
   */

  $$(
    'input[name="bm-logo-mode"]'
  )
  .forEach(
    radio => {

      radio.addEventListener(
        "change",
        () => {

          const mode =
            currentLogoMode();


          builtinPanel.hidden =
            mode !==
            "builtin";


          customPanel.hidden =
            mode !==
            "custom";


          base64Box.hidden =
            mode !==
            "custom";


          if (
            mode ===
            "builtin"
          ) {

            checkBuiltinLogo();

          }

          else {

            logoIsValid =
              true;

            updateOutputs();

          }

        }
      );

    }
  );


  /*
   * File Input
   */

  fileInput.addEventListener(
    "change",
    event => {

      loadCustomLogo(
        event.target.files[0]
      );

    }
  );


  /*
   * Drag & Drop
   */

  dropZone.addEventListener(
    "dragover",
    event => {

      event.preventDefault();

      dropZone.classList.add(
        "drag"
      );

    }
  );


  dropZone.addEventListener(
    "dragleave",
    () => {

      dropZone.classList.remove(
        "drag"
      );

    }
  );


  dropZone.addEventListener(
    "drop",
    event => {

      event.preventDefault();

      dropZone.classList.remove(
        "drag"
      );


      loadCustomLogo(
        event.dataTransfer.files[0]
      );

    }
  );


  /*
   * Re-compress on option change
   */

  targetSize.addEventListener(
    "change",
    () => {

      if (currentCustomFile) {

        loadCustomLogo(
          currentCustomFile
        );

      }

    }
  );


  maxDimension.addEventListener(
    "change",
    () => {

      if (currentCustomFile) {

        loadCustomLogo(
          currentCustomFile
        );

      }

    }
  );


  /*
   * Logo Check
   */

  checkLogoButton.addEventListener(
    "click",
    checkBuiltinLogo
  );


  logoSlug.addEventListener(
    "input",
    () => {

      clearTimeout(
        logoCheckTimer
      );


      logoCheckTimer =
        setTimeout(
          checkBuiltinLogo,
          600
        );

    }
  );


  /*
   * Color sync
   */

  function connectColor(
    picker,
    text
  ) {

    picker.addEventListener(
      "input",
      () => {

        text.value =
          picker.value.replace(
            "#",
            ""
          );

        updateOutputs();

      }
    );


    text.addEventListener(
      "input",
      () => {

        const value =
          normalizeColor(
            text.value
          );


        if (
          /^[0-9a-fA-F]{6}$/
            .test(value)
        ) {

          picker.value =
            "#" +
            value;

        }


        updateOutputs();

      }
    );

  }


  connectColor(
    labelColorPicker,
    labelColor
  );


  connectColor(
    messageColorPicker,
    messageColor
  );


  connectColor(
    logoColorPicker,
    logoColor
  );


  /*
   * Normal inputs
   */

  [
    label,
    message,
    style,
    link
  ]
  .forEach(
    element => {

      element.addEventListener(
        "input",
        updateOutputs
      );

      element.addEventListener(
        "change",
        updateOutputs
      );

    }
  );


  /*
   * Copy
   */

  $$(
    "[data-copy]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        async () => {

          const map = {

            markdown:
              markdownOutput,

            html:
              htmlOutput,

            url:
              urlOutput,

            base64:
              base64Output

          };


          const output =
            map[
              button.dataset.copy
            ];


          if (!output) {
            return;
          }


          try {

            await navigator
              .clipboard
              .writeText(
                output.value
              );

          }

          catch {

            output.select();

            document.execCommand(
              "copy"
            );

          }


          const oldText =
            button.textContent;


          button.textContent =
            "已复制";


          setTimeout(
            () => {

              button.textContent =
                oldText;

            },
            1000
          );

        }
      );

    }
  );


  /*
   * Initial
   */

  checkBuiltinLogo();

  updateOutputs();

})();
</script>
