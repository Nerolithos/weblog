<style>
	/* 阅读进度条样式：独立于主题 CSS，避免缓存问题 */
	#reading-progress {
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 6px;
		background: rgba(0, 160, 200, 0.08);
		z-index: 9999;
		pointer-events: none;
	}

	#reading-progress-bar {
		width: 100%;
		height: 100%;
		background: #00a0c8;
		box-shadow: 0 0 6px rgba(0, 160, 200, 0.8);
		transform-origin: left center;
		transform: scaleX(0);
		transition: transform 0.08s linear;
	}

	/* 首页文章卡片悬浮特效：保证本地/线上都可见 */
	.home-post-card {
		position: relative;
		background: rgba(255, 255, 255, 0.34);
		border: 1px solid rgba(255, 255, 255, 0.26);
		border-radius: 8px;
		padding: 0.75rem 1.5rem; /* 增加左右留白，让文字不贴边 */
		backdrop-filter: blur(8px) saturate(130%);
		-webkit-backdrop-filter: blur(8px) saturate(130%);
		box-shadow:
			inset 0 1px 0 rgba(255, 255, 255, 0.42),
			0 10px 22px rgba(15, 23, 42, 0.1);
		cursor: pointer;
		transition: transform 0.15s ease-out,
								box-shadow 0.15s ease-out,
								background 0.15s ease-out,
								border-color 0.15s ease-out;
	}

	.home-post-card::before {
		content: "";
		position: absolute;
		inset: 0;
		border-radius: inherit;
		pointer-events: none;
		background: linear-gradient(132deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.01) 36%, rgba(255, 255, 255, 0.1) 100%);
		opacity: 0.62;
	}

	.home-post-card:hover {
		transform: translateY(-4px) scale(1.01);
		box-shadow:
			inset 0 1px 0 rgba(255, 255, 255, 0.5),
			0 12px 28px rgba(15, 23, 42, 0.14);
		background: rgba(255, 255, 255, 0.42);
		border-color: rgba(255, 255, 255, 0.4);
		z-index: 2;
	}

	body.dark-mode .home-post-card {
		background: rgba(15, 23, 42, 0.34);
		border-color: rgba(148, 163, 184, 0.22);
		box-shadow:
			inset 0 1px 0 rgba(203, 213, 225, 0.12),
			0 10px 24px rgba(2, 6, 23, 0.42);
	}

	body.dark-mode .home-post-card::before {
		background: linear-gradient(140deg, rgba(226, 232, 240, 0.18), rgba(226, 232, 240, 0.01) 42%, rgba(148, 163, 184, 0.1) 100%);
	}

	body.dark-mode .home-post-card:hover {
		background: rgba(15, 23, 42, 0.4);
		border-color: rgba(148, 163, 184, 0.3);
	}

	.home-post-preview {
		max-height: 4.5em; /* 默认约 3 行 */
		overflow: hidden;
		position: relative;
		transition: max-height 0.2s ease-out;
	}

	.home-post-card:hover .home-post-preview {
		max-height: 12em; /* 悬浮时展开更多文字作为预览 */
	}

	/* 搜索跳转高亮：固定橙色，仅在带 hl 参数时显示 */
	.search-jump-highlight {
		background: rgba(251, 146, 60, 0.38);
		box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.45);
		border-radius: 3px;
	}

	/* 文章内图片点击放大 */
	.post-content-image-zoomable {
		cursor: zoom-in;
		transition: filter 0.15s ease-out;
	}

	.post-content-image-zoomable:hover {
		filter: brightness(0.96);
	}

	.post-image-lightbox {
		--post-lightbox-overlay-bg: rgba(10, 14, 20, 0.88);
		position: fixed;
		inset: 0;
		display: none;
		align-items: center;
		justify-content: center;
		padding: 24px;
		background: var(--post-lightbox-overlay-bg);
		z-index: 10000;
	}

	.post-image-lightbox.is-open {
		display: flex;
	}

	.post-image-lightbox__inner {
		position: relative;
		max-width: min(96vw, 1400px);
		max-height: 92vh;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 10px;
	}

	.post-image-lightbox__loader {
		position: absolute;
		left: 50%;
		top: 46%;
		width: 74px;
		height: 74px;
		--post-image-loader-stroke: 4px;
		--post-image-loader-gap-length: 22px;
		transform: translate(-50%, -50%) rotate(45deg);
		pointer-events: none;
		opacity: 0;
		transition: opacity 0.16s ease-out;
		z-index: 2;
	}

	.post-image-lightbox.is-loading .post-image-lightbox__loader {
		opacity: 1;
	}

	.post-image-lightbox__loader::before,
	.post-image-lightbox__loader::after {
		content: "";
		position: absolute;
		inset: 0;
		border-radius: 0;
	}

	.post-image-lightbox__loader::before {
		border: var(--post-image-loader-stroke) solid rgba(241, 245, 249, 0.58);
		box-shadow:
			inset 0 0 0 1px rgba(255, 255, 255, 0.28),
			0 0 8px rgba(241, 245, 249, 0.45),
			0 0 18px rgba(148, 163, 184, 0.45),
			0 0 30px rgba(148, 163, 184, 0.22);
	}

	.post-image-lightbox__loader::after {
		inset: auto;
		width: var(--post-image-loader-gap-length);
		height: var(--post-image-loader-stroke);
		background: var(--post-lightbox-overlay-bg);
		border-radius: 999px;
		box-shadow: 0 0 0 1px rgba(10, 14, 20, 0.52);
		offset-path: path('M 8 2 L 66 2 L 66 66 L 8 66 L 8 2');
		offset-distance: 0%;
		offset-rotate: auto;
		animation: post-image-square-gap-run 1.35s linear infinite;
	}

	@keyframes post-image-square-gap-run {
		0% {
			offset-distance: 0%;
		}
		100% {
			offset-distance: 100%;
		}
	}

	.post-image-lightbox__image {
		max-width: 100%;
		max-height: calc(92vh - 3rem);
		width: auto;
		height: auto;
		opacity: 0;
		border-radius: 6px;
		box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
		transition: opacity 0.16s ease-out;
	}

	.post-image-lightbox__image.is-ready {
		opacity: 1;
	}

	.post-image-lightbox__close {
		position: absolute;
		top: -14px;
		right: -14px;
		width: 36px;
		height: 36px;
		border: 0;
		border-radius: 999px;
		background: rgba(0, 0, 0, 0.66);
		color: #ffffff;
		font-size: 22px;
		line-height: 1;
		cursor: pointer;
	}

	.post-image-lightbox__caption {
		max-width: 80ch;
		text-align: center;
		font-size: 0.95rem;
		line-height: 1.4;
		color: #f8fafc;
	}
</style>

{{/* 阅读进度条逻辑：在有对应 DOM 时才生效，避免干扰其它页面 */}}
<script>
	document.addEventListener('DOMContentLoaded', function () {
		var container = document.getElementById('reading-progress');
		var bar = document.getElementById('reading-progress-bar');
		if (!container || !bar) {
			return;
		}

		var ticking = false;

		function updateProgress() {
			var scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
			var docHeight = document.documentElement.scrollHeight - window.innerHeight;
			var ratio = 0;
			if (docHeight > 0) {
				ratio = scrollTop / docHeight;
			}
			if (ratio < 0) ratio = 0;
			if (ratio > 1) ratio = 1;

			bar.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
			ticking = false;
		}

		function requestTick() {
			if (!ticking) {
				window.requestAnimationFrame(updateProgress);
				ticking = true;
			}
		}

		window.addEventListener('scroll', requestTick, { passive: true });
		window.addEventListener('resize', requestTick);

		// 初始计算一次
		updateProgress();
	});
</script>

{{/* GitHub 仓库统计：页面加载后实时更新（含短时缓存，避免频繁请求） */}}
<script>
	document.addEventListener('DOMContentLoaded', function () {
		var widgets = document.querySelectorAll('[data-repo-stats]');
		if (!widgets.length) return;

		var cacheKey = 'repo-stats-live-cache-v2';
		var cacheTtlMs = 10 * 60 * 1000;

		function toInt(value, fallback) {
			var parsed = parseInt(value, 10);
			return Number.isFinite(parsed) ? parsed : fallback;
		}

		function parseCommitCountFromLinkHeader(linkHeader) {
			if (!linkHeader) return null;
			var match = linkHeader.match(/[?&]page=(\d+)>;\s*rel="last"/i);
			if (!match) return null;
			return toInt(match[1], null);
		}

		function applyStatsToWidget(widget, stars, commits, followers) {
			var starsNode = widget.querySelector('[data-repo-stars]');
			var commitsNode = widget.querySelector('[data-repo-commits]');
			var followersNode = widget.querySelector('[data-repo-followers]');
			if (starsNode) starsNode.textContent = String(stars);
			if (commitsNode) commitsNode.textContent = String(commits);
			if (followersNode) followersNode.textContent = String(followers);
		}

		function applyStats(stars, commits, followers) {
			widgets.forEach(function (widget) {
				applyStatsToWidget(widget, stars, commits, followers);
			});
		}

		function readFallback() {
			var first = widgets[0];
			return {
				stars: toInt(first.getAttribute('data-fallback-stars'), 0),
				commits: toInt(first.getAttribute('data-fallback-commits'), 0),
				followers: toInt(first.getAttribute('data-fallback-followers'), 0)
			};
		}

		function readCache() {
			try {
				var raw = localStorage.getItem(cacheKey);
				if (!raw) return null;
				var cached = JSON.parse(raw);
				if (!cached || !cached.updatedAt) return null;
				if (Date.now() - cached.updatedAt > cacheTtlMs) return null;
				if (!Number.isFinite(cached.stars) || !Number.isFinite(cached.commits) || !Number.isFinite(cached.followers)) return null;
				return cached;
			} catch (e) {
				return null;
			}
		}

		function writeCache(stars, commits, followers) {
			try {
				localStorage.setItem(cacheKey, JSON.stringify({
					stars: stars,
					commits: commits,
					followers: followers,
					updatedAt: Date.now()
				}));
			} catch (e) {}
		}

		var fallback = readFallback();
		applyStats(fallback.stars, fallback.commits, fallback.followers);

		var cached = readCache();
		if (cached) {
			applyStats(cached.stars, cached.commits, cached.followers);
		}

		var firstWidget = widgets[0];
		var owner = firstWidget.getAttribute('data-repo-owner') || 'Nerolithos';
		var repo = firstWidget.getAttribute('data-repo-name') || 'weblog';
		var repoApiUrl = 'https://api.github.com/repos/' + owner + '/' + repo;
		var commitsApiUrl = repoApiUrl + '/commits?per_page=1';
		var userApiUrl = 'https://api.github.com/users/' + owner;

		Promise.all([
			fetch(repoApiUrl, { cache: 'no-store' }),
			fetch(commitsApiUrl, { cache: 'no-store' }),
			fetch(userApiUrl, { cache: 'no-store' })
		]).then(function (responses) {
			var repoResponse = responses[0];
			var commitsResponse = responses[1];
			var userResponse = responses[2];

			if (!repoResponse.ok || !commitsResponse.ok || !userResponse.ok) {
				throw new Error('GitHub API response not ok');
			}

			var commitCountFromHeader = parseCommitCountFromLinkHeader(commitsResponse.headers.get('link'));
			var commitsDataPromise = commitCountFromHeader !== null
				? Promise.resolve({ count: commitCountFromHeader })
				: commitsResponse.json().then(function (data) {
					var count = Array.isArray(data) ? data.length : 0;
					return { count: count };
				});

			return Promise.all([repoResponse.json(), commitsDataPromise, userResponse.json()]);
		}).then(function (payload) {
			var repoData = payload[0] || {};
			var commitMeta = payload[1] || {};
			var userData = payload[2] || {};
			var stars = toInt(repoData.stargazers_count, fallback.stars);
			var commits = toInt(commitMeta.count, fallback.commits);
			var followers = toInt(userData.followers, fallback.followers);

			if (stars < 0) stars = fallback.stars;
			if (commits < 0) commits = fallback.commits;
			if (followers < 0) followers = fallback.followers;

			applyStats(stars, commits, followers);
			writeCache(stars, commits, followers);
		}).catch(function () {
			// 网络受限或 API 限流时保持已有 fallback/cached 显示
		});
	});
</script>

{{/* 首页卡片点击整块跳转到对应文章 */}}
<script>
	document.addEventListener('DOMContentLoaded', function () {
		var cards = document.querySelectorAll('.home-post-card[data-post-url]');
		if (!cards || !cards.length) {
			return;
		}

		cards.forEach(function (card) {
			var url = card.getAttribute('data-post-url');
			if (!url) return;

			card.addEventListener('click', function (event) {
				var targetElement = event.target && event.target.nodeType === 1 ? event.target : (event.target ? event.target.parentElement : null);
				// 如果点击的是内部已有的 <a>，沿用原生行为
				if (targetElement && targetElement.closest && targetElement.closest('a, button, [data-no-card-nav]')) {
					return;
				}
				window.location.href = url;
			});
		});
	});
</script>

{{/* 文章页目录 scrollspy：高亮当前章节 */}}
<script>
	document.addEventListener('DOMContentLoaded', function () {
		var toc = document.querySelector('.post-toc');
		if (!toc) return;

		var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
		if (!links.length) return;
		var tocInner = toc.querySelector('.post-toc-inner');
		var lastActiveLink = null;

		var sections = [];
		links.forEach(function (link) {
			var href = link.getAttribute('href');
			if (!href || href.charAt(0) !== '#') return;
			var id = decodeURIComponent(href.slice(1));
			var el = document.getElementById(id);
			if (el) {
				sections.push({ link: link, el: el });
			}
		});

		if (!sections.length) return;

		function ensureActiveTocVisible(activeLink) {
			if (!tocInner || !activeLink) return;

			var containerRect = tocInner.getBoundingClientRect();
			var linkRect = activeLink.getBoundingClientRect();
			var padding = 14;

			if (linkRect.top >= containerRect.top + padding && linkRect.bottom <= containerRect.bottom - padding) {
				return;
			}

			var targetTop = activeLink.offsetTop - tocInner.clientHeight * 0.35;
			if (targetTop < 0) targetTop = 0;
			var maxTop = tocInner.scrollHeight - tocInner.clientHeight;
			if (targetTop > maxTop) targetTop = maxTop;

			tocInner.scrollTo({ top: targetTop, behavior: 'smooth' });
		}

		function onScroll() {
			var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
			var offset = 120; // 提前一点高亮当前小节
			var current = null;

			for (var i = 0; i < sections.length; i++) {
				var rect = sections[i].el.getBoundingClientRect();
				var top = rect.top + scrollY;
				if (top - offset <= scrollY) {
					current = sections[i];
				} else {
					break;
				}
			}

			links.forEach(function (lnk) {
				lnk.classList.remove('post-toc-active');
			});
			if (current) {
				current.link.classList.add('post-toc-active');
				if (current.link !== lastActiveLink) {
					lastActiveLink = current.link;
					ensureActiveTocVisible(current.link);
				}
			} else {
				lastActiveLink = null;
			}
		}

		window.addEventListener('scroll', onScroll, { passive: true });
		window.addEventListener('resize', onScroll);
		// 初次计算
		onScroll();

		// 目录最小化/展开逻辑
		var miniBtn = document.querySelector('.post-toc-mini');
		var toggleBtn = toc.querySelector('.post-toc-toggle');
		if (miniBtn && toggleBtn) {
			function hideToc() {
				toc.style.display = 'none';
				miniBtn.style.display = 'inline-flex';
			}

			function showToc() {
				toc.style.display = 'block';
				miniBtn.style.display = 'none';
			}

			toggleBtn.addEventListener('click', hideToc);
			miniBtn.addEventListener('click', showToc);
		}
	});
</script>

{{/* 文章内图片点击放大：仅 posts 正文生效 */}}
<script>
	document.addEventListener('DOMContentLoaded', function () {
		if (!document.getElementById('reading-progress')) return;

		var contentRoot = document.querySelector('.nested-copy-line-height');
		if (!contentRoot) return;

		var images = contentRoot.querySelectorAll('img');
		if (!images.length) return;

		var lightbox = document.createElement('div');
		lightbox.className = 'post-image-lightbox';
		lightbox.setAttribute('role', 'dialog');
		lightbox.setAttribute('aria-modal', 'true');
		lightbox.setAttribute('aria-hidden', 'true');
		lightbox.innerHTML =
			'<div class="post-image-lightbox__inner">' +
				'<div class="post-image-lightbox__loader" aria-hidden="true"></div>' +
				'<button type="button" class="post-image-lightbox__close" aria-label="Close image preview">&times;</button>' +
				'<img class="post-image-lightbox__image" alt="" />' +
				'<div class="post-image-lightbox__caption"></div>' +
			'</div>';
		document.body.appendChild(lightbox);

		var previewImage = lightbox.querySelector('.post-image-lightbox__image');
		var caption = lightbox.querySelector('.post-image-lightbox__caption');
		var closeBtn = lightbox.querySelector('.post-image-lightbox__close');
		var previousOverflow = '';

		function setLightboxLoading(isLoading) {
			if (isLoading) {
				lightbox.classList.add('is-loading');
			} else {
				lightbox.classList.remove('is-loading');
			}
		}

		previewImage.addEventListener('load', function () {
			previewImage.classList.add('is-ready');
			setLightboxLoading(false);
		});

		previewImage.addEventListener('error', function () {
			setLightboxLoading(false);
		});

		function closeLightbox() {
			if (!lightbox.classList.contains('is-open')) return;
			lightbox.classList.remove('is-open');
			setLightboxLoading(false);
			lightbox.setAttribute('aria-hidden', 'true');
			previewImage.classList.remove('is-ready');
			previewImage.removeAttribute('src');
			previewImage.setAttribute('alt', '');
			caption.textContent = '';
			caption.style.display = 'none';
			document.body.style.overflow = previousOverflow;
		}

		function openLightbox(src, alt) {
			if (!src) return;
			previousOverflow = document.body.style.overflow || '';
			previewImage.classList.remove('is-ready');
			setLightboxLoading(true);
			previewImage.src = src;
			previewImage.alt = alt || '';
			caption.textContent = alt || '';
			caption.style.display = alt ? 'block' : 'none';
			lightbox.classList.add('is-open');
			lightbox.setAttribute('aria-hidden', 'false');
			document.body.style.overflow = 'hidden';

			if (previewImage.complete && previewImage.naturalWidth > 0) {
				previewImage.classList.add('is-ready');
				setLightboxLoading(false);
			}
		}

		function pickPreviewSource(img) {
			var link = img.closest('a[href]');
			if (link) {
				var href = (link.getAttribute('href') || '').trim();
				if (href && href.charAt(0) !== '#' && !/^javascript:/i.test(href)) {
					return link.href;
				}
			}
			return img.currentSrc || img.src || '';
		}

		function bindImage(img) {
			if (img.dataset.zoomBound === 'true') return;
			img.dataset.zoomBound = 'true';
			img.classList.add('post-content-image-zoomable');

			if (!img.hasAttribute('tabindex')) {
				img.setAttribute('tabindex', '0');
			}

			img.addEventListener('click', function (event) {
				if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
					return;
				}
				event.preventDefault();
				openLightbox(pickPreviewSource(img), img.getAttribute('alt') || '');
			});

			img.addEventListener('keydown', function (event) {
				if (event.key !== 'Enter' && event.key !== ' ') return;
				event.preventDefault();
				openLightbox(pickPreviewSource(img), img.getAttribute('alt') || '');
			});
		}

		images.forEach(bindImage);

		closeBtn.addEventListener('click', closeLightbox);
		lightbox.addEventListener('click', function (event) {
			if (event.target === lightbox) {
				closeLightbox();
			}
		});

		document.addEventListener('keydown', function (event) {
			if (event.key === 'Escape') {
				closeLightbox();
			}
		});
	});
</script>

{{/* 搜索结果跳转：定位到正文中的命中词并高亮闪烁三次后移除 */}}
<script>
	document.addEventListener('DOMContentLoaded', function () {
		var params = new URLSearchParams(window.location.search);
		var query = (params.get('hl') || '').trim();
		if (!query) return;

		var contentRoot = document.querySelector('.nested-copy-line-height');
		if (!contentRoot) return;

		function escapeRegExp(s) {
			return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
		}

		function tokenizeForFallback(text) {
			var normalized = (text || '').toLowerCase();
			if (!normalized) return [];
			var tokens = [];
			var latin = normalized.match(/[a-z0-9_]+/g) || [];
			tokens = tokens.concat(latin);
			var cjkRuns = normalized.match(/[\u3400-\u9fff]+/g) || [];
			for (var r = 0; r < cjkRuns.length; r++) {
				var chars = Array.from(cjkRuns[r]);
				for (var i = 0; i < chars.length; i++) {
					tokens.push(chars[i]);
					if (i + 1 < chars.length) tokens.push(chars[i] + chars[i + 1]);
				}
			}
			var unique = Array.from(new Set(tokens));
			unique.sort(function (a, b) { return b.length - a.length; });
			return unique;
		}

		function findFirstTextMatch(patterns) {
			var walker = document.createTreeWalker(contentRoot, NodeFilter.SHOW_TEXT, {
				acceptNode: function (node) {
					if (!node || !node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
					var p = node.parentNode;
					if (!p || !p.tagName) return NodeFilter.FILTER_REJECT;
					var tag = p.tagName.toLowerCase();
					if (tag === 'script' || tag === 'style' || tag === 'noscript' || tag === 'mark') {
						return NodeFilter.FILTER_REJECT;
					}
					return NodeFilter.FILTER_ACCEPT;
				}
			});

			while (walker.nextNode()) {
				var node = walker.currentNode;
				var text = node.nodeValue;
				for (var i = 0; i < patterns.length; i++) {
					var re = patterns[i];
					re.lastIndex = 0;
					var m = re.exec(text);
					if (m && m[0]) {
						return { node: node, start: m.index, end: m.index + m[0].length };
					}
				}
			}
			return null;
		}

		var patterns = [];
		patterns.push(new RegExp(escapeRegExp(query), 'i'));
		var fallbackTokens = tokenizeForFallback(query).filter(function (t) { return t.length >= 2; });
		for (var i = 0; i < fallbackTokens.length; i++) {
			patterns.push(new RegExp(escapeRegExp(fallbackTokens[i]), 'i'));
		}

		var hit = findFirstTextMatch(patterns);
		if (!hit) return;

		var textNode = hit.node;
		var original = textNode.nodeValue;
		var before = original.slice(0, hit.start);
		var matchText = original.slice(hit.start, hit.end);
		var after = original.slice(hit.end);

		var wrapper = document.createElement('span');
		wrapper.className = 'search-jump-highlight';
		wrapper.textContent = matchText;

		var frag = document.createDocumentFragment();
		if (before) frag.appendChild(document.createTextNode(before));
		frag.appendChild(wrapper);
		if (after) frag.appendChild(document.createTextNode(after));
		textNode.parentNode.replaceChild(frag, textNode);

		wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
	});
</script>

{{/* 左下角 Liquid Glass 任务坞：站内搜索 + 深浅模式切换 */}}
<script>
	document.addEventListener('DOMContentLoaded', function () {
		var body = document.body;
		var storageKey = 'site-theme-mode';
			var conwayStorageKey = 'home-conway-grid-enabled';

		// 只负责在当前页面应用样式
		function applyThemeClass(mode) {
			if (mode === 'dark') {
				body.classList.add('dark-mode');
			} else {
				body.classList.remove('dark-mode');
			}
		}

		// 只负责把选择写入 localStorage
		function saveTheme(mode) {
			try {
				localStorage.setItem(storageKey, mode);
			} catch (e) {}
		}

		// 应用并持久化用户选择
		function applyAndSave(mode) {
			applyThemeClass(mode);
			saveTheme(mode);
		}

		function initTheme() {
			var saved = null;
			try {
				saved = localStorage.getItem(storageKey);
			} catch (e) {}
			if (saved === 'dark' || saved === 'light') {
				// 初始化时只根据已有记录设置样式，不重复写入
				applyThemeClass(saved);
			} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
				// 没有记录时，根据系统偏好设置一次样式，但不写入
				applyThemeClass('dark');
			}
		}

		function toggleTheme() {
			var isDark = body.classList.contains('dark-mode');
			var next = isDark ? 'light' : 'dark';
			applyAndSave(next);
		}

			function readConwayEnabled() {
				try {
					var stored = localStorage.getItem(conwayStorageKey);
					if (stored === null) return true;
					return stored !== '0';
				} catch (e) {
					return true;
				}
			}

			function saveConwayEnabled(enabled) {
				try {
					localStorage.setItem(conwayStorageKey, enabled ? '1' : '0');
				} catch (e) {}
			}

			function dispatchConwayToggle(enabled) {
				document.dispatchEvent(new CustomEvent('conway-grid-toggle', {
					detail: { enabled: !!enabled }
				}));
			}

			function syncConwayDockButtons() {
				var conwayButtons = document.querySelectorAll('[data-action="conway"]');
				if (!conwayButtons.length) return;
				var enabled = readConwayEnabled();
				conwayButtons.forEach(function (button) {
					button.setAttribute('aria-pressed', enabled ? 'true' : 'false');
					button.setAttribute('title', enabled ? 'Conway 显示控制（当前：开）' : 'Conway 显示控制（当前：关）');
				});
			}

		// 初始化主题：无论当前页面是否有任务坞都执行
		initTheme();
			dispatchConwayToggle(readConwayEnabled());
			syncConwayDockButtons();

		// 监听其它标签页对主题的修改，实现多页面同步
		window.addEventListener('storage', function (event) {
				if (event.key === storageKey) {
					var value = event.newValue;
					var mode = value === 'dark' ? 'dark' : 'light';
					// 来自其它页面的修改，仅在当前页更新样式，避免写入死循环
					applyThemeClass(mode);
					return;
				}
				if (event.key === conwayStorageKey) {
					var enabled = event.newValue !== '0';
					dispatchConwayToggle(enabled);
					syncConwayDockButtons();
				}
		});

		// 若页面没有任务坞，仅保留主题记忆功能
		var dock = document.querySelector('[data-liquid-dock]');
		if (!dock) return;

		var mainBtn = dock.querySelector('[data-dock-main]');
		var items = dock.querySelectorAll('[data-dock-item]');
		if (!mainBtn || !items.length) return;

		function openDock() {
			dock.classList.add('dock-open');
		}

		function closeDock() {
			dock.classList.remove('dock-open');
		}

		function toggleDockOpen() {
			dock.classList.toggle('dock-open');
		}

		mainBtn.addEventListener('click', function (event) {
			event.stopPropagation();
			toggleDockOpen();
		});

		document.addEventListener('click', function (event) {
			if (!dock.contains(event.target)) {
				closeDock();
			}
		});

		items.forEach(function (btn) {
			btn.addEventListener('click', function (event) {
				event.stopPropagation();
				var action = btn.getAttribute('data-action');
				if (action === 'search') {
					var url = dock.getAttribute('data-search-url') || '/search/';
					window.location.href = url;
					} else if (action === 'conway') {
						var nextEnabled = !readConwayEnabled();
						saveConwayEnabled(nextEnabled);
						dispatchConwayToggle(nextEnabled);
						syncConwayDockButtons();
				} else if (action === 'theme') {
					toggleTheme();
				} else if (action === 'lang') {
					// 预留：中英切换暂未实现
				}
				closeDock();
			});
		});
	});
</script>
