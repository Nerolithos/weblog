baseURL = 'https://blog.nero-lithos.com/'
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
languageCode = 'zh-cn'
title = "Lithos' Blog" # Blog title
theme = 'ananke1'
hasCJKLanguage = true
canonifyurls = false
pagination.pagerSize = 6

googleAnalytics = ""
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  custom_css = ["css/custom.css"]
  text_color = ""
  author = ""
  favicon = "/favicon.ico"
  site_logo = ""
  background_color_class = "bg-black"
  recent_posts_number = 100
  # 仍然保留页脚链接
  footer_links = [
    { name = "💻 GitHub", url = "https://github.com/Nerolithos" },
    { name = "🖋️ mdAnything", url = "https://md.nero-lithos.com" },
    { name = "🍅 LGuide", url = "https://lguide.net/" },
    { name = "💼 LinkedIn", url = "https://www.linkedin.com/in/zhu-ji-an/" },
    { name = "👋 Bonjour", url = "https://bonjour.bio/dh5568" },
    { name = "🎓 LGU CourseAI", url = "https://blog.nero-lithos.com/courseai/" }
  ]

# 顶部导航菜单（Ananke 会在 header 渲染 .Site.Menus.main）
[menu]
  [[menu.main]]
    name = "💻 GitHub"
    url  = "https://github.com/Nerolithos"
    weight = 1
  [[menu.main]]
    name = "🎨 Pixiv"
    url  = "https://lguide.net/"
    weight = 2
  [[menu.main]]
    name = "💼 LinkedIn"
    url  = "https://www.linkedin.com/in/zhu-ji-an/"
    weight = 3
  [[menu.main]]
    name = "🖋️ mdAnything"
    url  = "https://md.nero-lithos.com"
    weight = 5

[services]
  [services.disqus]
    shortname = 'nero-lithos'

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
    ordered = false
